# docker-compose.yml
version: "3.8"

services:
  # ========== Dictionary Service ==========
  dictionary:
    build:
      context: .
      dockerfile: services/dictionary_service/Dockerfile
    container_name: dactylus-dictionary
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./app/data/dictionary.db
      - PYTHONPATH=/app
    volumes:
      - ./services/dictionary_service/data:/app/app/data
    networks:
      - dactylus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ========== Users Service ==========
  users:
    build:
      context: .
      dockerfile: services/users_service/Dockerfile
    container_name: dactylus-users
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./app/data/users.db
      - PYTHONPATH=/app
    volumes:
      - ./services/users_service/data:/app/app/data
    networks:
      - dactylus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ========== Auth Service ==========
  auth:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: dactylus-auth
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=sqlite:///./app/data/auth.db
      - PYTHONPATH=/app
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY:-changeme-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    volumes:
      - ./services/auth_service/data:/app/app/data
    networks:
      - dactylus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  dactylus-network:
    driver: bridge